<title>Brandon's Command Centre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&family=Orbitron:wght@500;700&family=Anton&family=UnifrakturCook:wght@700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: lavender glass deck. Indigo rail on the left, indigo briefing banner on top, glass cards in a 12-col grid; week strip + feed on the right. */
:root {
  /* off shift: "after hours" — midnight violet, hot-pink neon, slowed-phonk mood. Always dark; it's a night vibe. */
  --bg: #07040d; --bg-2: #120a1f; --glass: rgba(24,12,38,.62); --glass-line: rgba(255,70,180,.16);
  --ink: #f5ecff; --muted: #a891c6; --indigo: #10071c; --indigo-2: #3d0d55; --on-indigo: #f8eeff; --on-indigo-muted: #c9a8ea;
  --lime: #ff46b4; --lime-ink: #1c0012; --violet: #a35cff; --good: #5cffb2; --warn: #ffc35c; --bad: #ff5c7a;
  --shadow: 0 18px 40px -18px rgba(0,0,0,.8), 0 0 0 1px rgba(255,70,180,.05); color-scheme: dark;
  --font-g: 'UnifrakturCook', 'Instrument Serif', Georgia, serif;
  --font-x: 'Anton', 'Plus Jakarta Sans', Impact, sans-serif;
  --font-d: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-s: 'Instrument Serif', Georgia, 'Times New Roman', serif;
  --font-m: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark } }
:root[data-theme="dark"] { color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font-family: var(--font-d); color: var(--ink); font-size: 15px; line-height: 1.45;
  background: radial-gradient(1200px 600px at 85% -10%, color-mix(in srgb, var(--violet) 22%, transparent), transparent 60%), radial-gradient(900px 500px at -10% 110%, color-mix(in srgb, var(--lime) 18%, transparent), transparent 60%), var(--bg);
  background-attachment: fixed; min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; }
.shell { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .shell { grid-template-columns: minmax(0, 1fr); } }

/* rail */
.rail { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); align-self: start; background: var(--indigo); border-radius: 26px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: calc(100vh - 32px); box-shadow: var(--shadow); }
.logo { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: var(--lime); font-weight: 800; font-size: 20px; letter-spacing: -.04em; margin-bottom: 10px; background: color-mix(in srgb, var(--on-indigo) 8%, transparent); }
.rail .railink { width: 46px; height: 46px; border-radius: 14px; color: var(--lime); display: grid; place-items: center; position: relative; flex: none; }
.rail .railink:hover .tip { opacity: 1; }
.rail .railink .tip { position: absolute; left: 56px; white-space: nowrap; background: var(--ink); color: var(--bg); font-size: 12px; padding: 4px 8px; border-radius: 6px; opacity: 0; pointer-events: none; z-index: 5; }
.rail button { width: 46px; height: 46px; border-radius: 14px; border: 0; background: transparent; color: var(--on-indigo-muted); cursor: pointer; display: grid; place-items: center; position: relative; transition: background .2s, color .2s; }
.rail button:hover { color: var(--on-indigo); background: color-mix(in srgb, var(--on-indigo) 10%, transparent); }
.rail button[aria-current="page"] { background: var(--lime); color: var(--lime-ink); }
.rail button .tip { position: absolute; left: 56px; white-space: nowrap; background: var(--ink); color: var(--bg); font-size: 12px; padding: 4px 8px; border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 5; }
.rail button:hover .tip, .rail button:focus-visible .tip { opacity: 1; }
.rail .spacer { flex: 1; }
.rail svg { width: 21px; height: 21px; }
@media (max-width: 760px) {
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; flex-direction: row; min-height: 0; border-radius: 20px; padding: 8px; overflow-x: auto; justify-content: space-between; }
  .logo { margin: 0 4px 0 0; } .rail .spacer { display: none; } .rail button .tip { display: none; }
}

main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; } .c3 { grid-column: span 3; }
@media (max-width: 1100px) { .c3, .c4 { grid-column: span 6; } .c5, .c7, .c8 { grid-column: span 12; } }
@media (max-width: 640px) { .c4, .c5, .c6, .c7, .c8 { grid-column: span 12; } .c3 { grid-column: span 6; } .stat { padding: 14px; } }

.card { background: var(--glass); border: 1px solid var(--glass-line); border-radius: 24px; padding: 18px; box-shadow: var(--shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); min-width: 0; display: flex; flex-direction: column; gap: 12px; animation: rise .5s both; }
.card:nth-child(2) { animation-delay: .05s } .card:nth-child(3) { animation-delay: .1s } .card:nth-child(4) { animation-delay: .15s } .card:nth-child(5) { animation-delay: .2s } .card:nth-child(6) { animation-delay: .25s }
@keyframes rise { from { transform: translateY(10px); } to { transform: none; } }
.card.dark { background: var(--indigo); color: var(--on-indigo); border-color: transparent; }
.card.dark .muted { color: var(--on-indigo-muted); }
.head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: clamp(1.5rem, 3vw, 2.1rem); font-weight: 700; letter-spacing: -.02em; line-height: 1.15; text-wrap: balance; }
h1 em { font-family: var(--font-s); font-style: italic; font-weight: 400; color: var(--lime); font-size: 1.15em; }
h2 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--font-m); font-variant-numeric: tabular-nums; }
.pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--violet) 14%, transparent); color: var(--violet); white-space: nowrap; }
.card.dark .pill { background: color-mix(in srgb, var(--on-indigo) 12%, transparent); color: var(--on-indigo); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lime) 30%, transparent); }
.btn { font: inherit; font-weight: 700; font-size: 14px; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; background: var(--lime); color: var(--lime-ink); display: inline-flex; align-items: center; gap: 8px; transition: transform .12s; text-decoration: none; }
.btn:hover { transform: translateY(-1px); } .btn:active { transform: none; }
.btn.ghost { background: color-mix(in srgb, var(--violet) 12%, transparent); color: var(--ink); }
.card.dark .btn.ghost { background: color-mix(in srgb, var(--on-indigo) 12%, transparent); color: var(--on-indigo); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.iconbtn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--glass-line); background: var(--glass); color: var(--ink); cursor: pointer; display: grid; place-items: center; font-size: 18px; line-height: 1; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

/* hero */
.hero { padding: 24px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; background: radial-gradient(500px 220px at 90% 0%, var(--indigo-2), transparent 70%), var(--indigo); }
@media (max-width: 640px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.hero .sub { max-width: 62ch; }
.hero .side { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
@media (max-width: 640px) { .hero .side { align-items: flex-start; } }
.quip { font-family: var(--font-s); font-style: italic; font-size: 1.1rem; color: var(--on-indigo-muted); }

/* week */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { text-align: center; padding: 8px 0; border-radius: 14px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); border: 0; background: transparent; font-family: inherit; cursor: pointer; }
.day b { font-size: 17px; color: var(--ink); font-weight: 700; }
.day.today { background: var(--indigo); color: var(--on-indigo-muted); } .day.today b { color: var(--on-indigo); }
.day .marks { display: flex; gap: 3px; justify-content: center; height: 6px; }
.day .marks i { width: 5px; height: 5px; border-radius: 50%; background: var(--violet); }
.day.today .marks i { background: var(--lime); }

/* stats */
.stat .n { font-size: clamp(1.8rem, 3.4vw, 2.5rem); font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .lbl { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
.stat .ico { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--violet) 14%, transparent); color: var(--violet); }
.stat .ico svg { width: 16px; height: 16px; }

/* projects */
.proj { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--glass-line); }
.proj:last-child { border-bottom: 0; }
.badge { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--lime-ink); }
.bar { height: 8px; border-radius: 999px; background: color-mix(in srgb, var(--violet) 14%, transparent); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--violet), var(--indigo-2)); transition: width .6s; }
.proj .t { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
.proj .s { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.pct { font-family: var(--font-m); font-size: 13px; font-weight: 500; }

/* focus list */
.focus { display: flex; flex-direction: column; gap: 6px; }
.focus label { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 14px; background: color-mix(in srgb, var(--violet) 6%, transparent); cursor: pointer; }
.focus input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--indigo-2); }
.focus input:checked + span { text-decoration: line-through; color: var(--muted); }
.x { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0 4px; }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; min-width: 0; }
input, select, textarea { font: inherit; font-size: 15px; color: var(--ink); background: var(--bg-2); border: 1px solid var(--glass-line); border-radius: 12px; padding: 9px 12px; width: 100%; }
textarea { resize: vertical; min-height: 70px; }

/* print queue */
.prints { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.print { border-radius: 18px; padding: 12px; background: var(--bg-2); border: 1px solid var(--glass-line); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.print .swatch { height: 54px; border-radius: 12px; display: grid; place-items: center; font-family: var(--font-m); font-size: 12px; color: var(--lime-ink); font-weight: 500; }
.print .t { font-weight: 700; font-size: 13px; overflow-wrap: anywhere; }
.chip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--indigo); color: var(--on-indigo); align-self: flex-start; }
.chip.printing { background: var(--lime); color: var(--lime-ink); }
.chip.done { background: color-mix(in srgb, var(--good) 22%, transparent); color: var(--good); }
.chip.idea { background: color-mix(in srgb, var(--violet) 16%, transparent); color: var(--violet); }

/* feed */
.tabs { display: flex; gap: 14px; font-size: 13px; font-weight: 600; color: var(--muted); }
.tabs button { border: 0; background: none; font: inherit; color: inherit; padding: 0 0 4px; cursor: pointer; border-bottom: 2px solid transparent; }
.tabs button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.feed { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; }
.ev { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px; border-radius: 14px; background: color-mix(in srgb, var(--violet) 5%, transparent); }
.ev .av { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: var(--lime-ink); }
.ev .txt { font-size: 13px; overflow-wrap: anywhere; }
.ev .when { font-size: 11px; color: var(--muted); font-family: var(--font-m); }

/* list views */
.rows { display: flex; flex-direction: column; gap: 10px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 14px; border-radius: 18px; background: var(--bg-2); border: 1px solid var(--glass-line); }
.row .t { font-weight: 700; overflow-wrap: anywhere; }
.row .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.row .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.form .wide { grid-column: 1 / -1; }
input[type=range] { padding: 0; accent-color: var(--indigo-2); background: transparent; border: 0; }
.empty { border: 2px dashed var(--glass-line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; color: var(--muted); }
.empty b { color: var(--ink); font-size: 15px; }
.tag-ex { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 2px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--indigo); color: var(--on-indigo); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 20; box-shadow: var(--shadow); }
/* arc ring */
.arc { position: relative; width: 132px; height: 132px; flex: none; }
.arc svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.arc .track { fill: none; stroke: color-mix(in srgb, var(--on-indigo) 12%, transparent); stroke-width: 10; }
.arc .val { fill: none; stroke: var(--lime); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--lime) 60%, transparent)); }
.arc .spin { fill: none; stroke: color-mix(in srgb, var(--lime) 35%, transparent); stroke-width: 1.5; stroke-dasharray: 3 9; transform-origin: 50% 50%; animation: spin 18s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.arc .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.arc .mid b { font-size: 28px; font-weight: 800; letter-spacing: -.03em; color: var(--on-indigo); line-height: 1; }
.arc .mid span { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--on-indigo-muted); margin-top: 4px; }
.logo.reactor { background: radial-gradient(circle, var(--lime) 0 18%, transparent 19% 34%, color-mix(in srgb, var(--lime) 55%, transparent) 35% 40%, transparent 41%), color-mix(in srgb, var(--on-indigo) 8%, transparent); box-shadow: 0 0 18px -4px var(--lime); }
/* shift card */
.shift { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.shift .clock { font-family: var(--font-m); font-size: 26px; font-weight: 500; letter-spacing: -.02em; }
.onshift { background: linear-gradient(135deg, color-mix(in srgb, var(--lime) 30%, var(--glass)), var(--glass)); }
/* focus protocol */
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--on-indigo); background: color-mix(in srgb, var(--on-indigo) 10%, transparent); border: 0; border-radius: 999px; padding: 6px 12px 6px 6px; font-family: inherit; }
.switch i { width: 30px; height: 18px; border-radius: 999px; background: color-mix(in srgb, var(--on-indigo) 25%, transparent); position: relative; transition: background .2s; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--on-indigo); transition: transform .2s; }
.switch[aria-pressed="true"] i { background: var(--lime); } .switch[aria-pressed="true"] i::after { transform: translateX(12px); background: var(--lime-ink); }
.focusbig { font-size: clamp(1.3rem, 2.6vw, 1.8rem); font-weight: 800; letter-spacing: -.02em; }
/* section skins */
.hero.garage { background: var(--indigo); position: relative; overflow: hidden; }
.hero.garage::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: repeating-linear-gradient(-45deg, var(--lime) 0 12px, #1d1a3a 12px 24px); }
.hero.dr { background: radial-gradient(600px 240px at 90% 10%, #6b1f2a, transparent 70%), #17121c; }
.hero.dr h1 { font-family: var(--font-m); letter-spacing: .04em; text-transform: uppercase; }
.hero.dr .pill { background: rgba(255,90,90,.16); color: #ff9a9a; }
.hero.dr .btn { background: #e2574c; color: #fff; }
.daycount { font-family: var(--font-m); font-size: 13px; color: #ff9a9a; }
/* J.A.R.V.I.S. assistant */
.jv-fab { position: fixed; left: 0; top: 0; transform: translate(var(--jx, calc(100vw - 106px)), var(--jy, calc(100vh - 106px))); transition: transform 1.4s cubic-bezier(.45,.05,.2,1); touch-action: none; z-index: 30; width: 88px; height: 88px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; background: radial-gradient(circle, #0b1a30, #03070f 70%); box-shadow: 0 12px 30px -8px rgba(0,60,120,.6), 0 0 0 1px rgba(62,200,255,.35), 0 0 24px -4px rgba(62,200,255,.55); }
.jv-fab.dragging { transition: none; cursor: grabbing; }
.jv-fab.flying { box-shadow: 0 0 0 1px rgba(62,200,255,.5), 0 0 40px 2px rgba(62,200,255,.6); }
.jv-spot { outline: 2px solid rgba(62,200,255,.9); outline-offset: 4px; box-shadow: 0 0 0 8px rgba(62,200,255,.15), var(--shadow) !important; transition: outline-color .4s; }
.jv-fab canvas { width: 100%; height: 100%; display: block; border-radius: 50%; animation: bob 5s ease-in-out infinite; pointer-events: none; }
.jv-fab.flip .hint { right: auto; left: 96px; }
.jv-fab .hint.bubble { white-space: normal; width: max-content; max-width: min(280px, calc(100vw - 140px)); text-align: left; line-height: 1.35; border: 1px solid rgba(62,200,255,.45); box-shadow: 0 0 22px -6px rgba(62,200,255,.7), var(--shadow); animation: pop .25s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(-50%) scale(.9); } to { opacity: 1; transform: translateY(-50%) scale(1); } }
.jv-fab .hint { position: absolute; right: 96px; top: 50%; transform: translateY(-50%); white-space: nowrap; background: var(--indigo); color: var(--on-indigo); font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 14px; box-shadow: var(--shadow); }
@keyframes bob { 50% { transform: translateY(-6px); } }
.jv { position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 31; width: min(400px, calc(100vw - 36px)); height: min(600px, calc(100vh - 36px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px))); display: flex; flex-direction: column; border-radius: 28px; overflow: hidden; background: var(--indigo); color: var(--on-indigo); box-shadow: 0 30px 60px -20px rgba(20,16,60,.7); }
.jv-top { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 14px 10px; background: radial-gradient(300px 140px at 20% 0%, var(--indigo-2), transparent 70%); }
.jv-top canvas { width: 130px; height: 130px; display: block; border-radius: 50%; background: radial-gradient(circle, #0b1a30, #03070f 72%); }
.jv-name { font-weight: 800; letter-spacing: .08em; font-size: 15px; }
.jv-state { font-family: var(--font-m); font-size: 11px; color: var(--lime); letter-spacing: .06em; text-transform: uppercase; }
.jv-top .iconbtn { background: color-mix(in srgb, var(--on-indigo) 10%, transparent); color: var(--on-indigo); border: 0; }
.jv-log { flex: 1; overflow-y: auto; padding: 6px 14px 10px; display: flex; flex-direction: column; gap: 8px; background: color-mix(in srgb, #000 12%, transparent); }
.msg { max-width: 88%; padding: 9px 12px; border-radius: 16px; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg.j { align-self: flex-start; background: color-mix(in srgb, var(--on-indigo) 10%, transparent); border-bottom-left-radius: 4px; }
.msg.u { align-self: flex-end; background: var(--lime); color: var(--lime-ink); border-bottom-right-radius: 4px; }

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
let toastT; const toast = m => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); };

/* ---------- reference ---------- */
const AREAS = {
  vehicle: { name: 'Vehicle', c: '#d6f25c' }, print: { name: '3D printing', c: '#b8acff' }, business: { name: 'Business', c: '#9fe3c2' },
  game: { name: 'DEAD RECKONING', c: '#ffb38a' }, jarvis: { name: 'Command centre', c: '#8fd3ff' }, work: { name: 'Shop', c: '#f6d36b' }, shift: { name: 'Shift', c: '#f6d36b' }
};
const QUIPS = {
  any: ['All systems nominal. One of them is you.', 'I have taken the liberty of not judging the print queue.', 'A fine day to finish something, Sir. Statistically.', 'Your ideas vault is growing faster than your free time.', 'Coffee level unknown. Proceed with caution.', 'Should you need me, I shall be here. Indexing your ambitions.'],
  morning: ['Good morning. The coffee is not my department, but I approve.', 'Torque wrenches calibrated, Sir. Metaphorically.'],
  night: ['It is late, Sir. The zombies will still be there tomorrow.', 'Burning the midnight oil again. I have logged it under "passion".', 'Sleep is also a maintenance interval, Sir.'],
  shift: ['On shift. I shall keep the side projects quiet until you clock out.', 'Shop mode engaged. Pull the PSR before you touch anything, Sir.', 'Machines first, empire later.'],
  busy: ['Several fronts open at once. Very Napoleonic, Sir.', 'Busy week. I have cleared your calendar of nothing, as there was nothing to clear.'],
  quiet: ['A quiet board. Either discipline or the calm before a print failure.', 'Nothing moving. I await your instructions with professional patience.'],
  game: ['The undead in DEAD RECKONING remain unbothered by deadlines.', 'A survival game made by a man who survives Monday shifts. Authentic.']
};
function pickQuip(ctx) {
  const h = new Date().getHours(), pool = [...QUIPS.any];
  if (h >= 5 && h < 11) pool.push(...QUIPS.morning);
  if (h >= 22 || h < 5) pool.push(...QUIPS.night, ...QUIPS.night);
  if (ctx.onShift) return QUIPS.shift[(new Date().getMinutes() >> 2) % QUIPS.shift.length];
  if (ctx.active >= 3) pool.push(...QUIPS.busy); else if (!ctx.active) pool.push(...QUIPS.quiet);
  if (ctx.game) pool.push(...QUIPS.game);
  return pool[(new Date().getDate() * 7 + h) % pool.length];
}
const SHOPCHECKS = [
  'Pull a Product Status Report (PSR) before the repair',
  'Key out, lockout / tagout as the job requires',
  'Chock tracks or wheels, lower attachments to the ground',
  'Record active and logged codes',
  'Photos before teardown',
  'Log steps and findings on the work order as you go',
  'Pull a PSR after the repair',
  'Clean up, final walk-around and test run'
];
let modeLock = false;
function applyMode() { if (modeLock) return; const on = !!(S.items.get('shift') || {}).on; document.documentElement.dataset.mode = on ? 'shop' : ''; }
function setShift(on) {
  const s = { ...(S.items.get('shift') || {}), id: 'shift', type: 'shift' };
  if (on === !!s.on) return;
  const door = document.getElementById('door'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (on) { s.on = true; s.since = Date.now(); s.checks = []; } else { s.on = false; s.last = Date.now() - s.since; s.ended = Date.now(); }
  if (reduce || !door) { save(s, on ? 'Shift started: shop mode' : 'Shift ended after ' + fmtDur(s.last)); applyMode(); render(); toast(on ? 'Shop mode engaged' : 'Shift logged. Welcome back, Sir.'); return; }
  modeLock = true;
  document.getElementById('doortext').textContent = on ? 'SHOP MODE' : 'STANDING DOWN';
  const sub = document.getElementById('doorsub'), line = on ? 'J.A.R.V.I.S. › SHOP SYSTEMS ONLINE' : 'J.A.R.V.I.S. › SHIFT LOGGED · ' + fmtDur(s.last);

  setTimeout(() => {
    save(s, on ? 'Shift started: shop mode' : 'Shift ended after ' + fmtDur(s.last));
    modeLock = false; applyMode(); render(); scrollTo(0, 0);
    setTimeout(() => { door.className = 'door up'; toast(on ? 'Shop mode engaged' : 'Shift logged. Welcome back, Sir.'); setTimeout(() => door.className = 'door', 600); }, 700);
  }, 900);
}
let prefs = { focus: false }; try { prefs = { ...prefs, ...JSON.parse(localStorage.getItem('cc.prefs') || '{}') }; } catch (e) {}
const savePrefs = () => { try { localStorage.setItem('cc.prefs', JSON.stringify(prefs)); } catch (e) {} };
const fmtDur = ms => { const m = Math.floor(ms / 60000); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const STATUS = { idea: 'Idea', active: 'Active', paused: 'Paused', done: 'Done' };
const PSTATE = { queued: 'Queued', printing: 'Printing', done: 'Done' };
const ISTAGE = { raw: 'Raw', research: 'Researching', numbers: 'Running numbers', go: 'Worth a go', shelved: 'Shelved' };
const VIEWS = ['overview', 'projects', 'garage', 'prints', 'ideas', 'deadreckoning'];

/* ---------- storage: private per-user db, else this browser ---------- */
const S = { items: new Map(), log: [] };
let coll = null, logDoc = null, mode = 'local', loaded = false;
const lsGet = () => { try { const d = JSON.parse(localStorage.getItem('cc.items') || '[]'); d.forEach(o => S.items.set(o.id, o)); S.log = JSON.parse(localStorage.getItem('cc.log') || '[]'); } catch (e) {} };
const lsPut = () => { try { localStorage.setItem('cc.items', JSON.stringify([...S.items.values()])); localStorage.setItem('cc.log', JSON.stringify(S.log)); } catch (e) {} };
const writing = {};
async function save(o, logText) {
  o.updated = Date.now(); if (!o.created) o.created = o.updated; S.items.set(o.id, o);
  if (logText) logIt(logText, o.area || o.type);
  if (mode !== 'db') { lsPut(); render(); return; }
  render();
  if (writing[o.id]) { writing[o.id].again = true; return; }
  writing[o.id] = { again: false };
  try { do { writing[o.id].again = false; await coll.doc(o.id).set(JSON.parse(JSON.stringify(S.items.get(o.id)))); } while (writing[o.id].again); }
  catch (e) { toast(e.code === 'quota_exceeded' ? 'Storage is full. Delete a few old entries.' : 'Couldn\'t save. Check your connection.'); }
  finally { delete writing[o.id]; }
}
async function del(id) {
  const o = S.items.get(id); S.items.delete(id); if (o) logIt('Removed ' + o.title, o.area || o.type);
  if (mode === 'db') { try { await coll.doc(id).delete(); } catch (e) { toast('Couldn\'t delete.'); } } else lsPut();
  render();
}
let logTimer;
function logIt(text, area) {
  S.log.unshift({ at: Date.now(), text, area }); S.log = S.log.slice(0, 60);
  if (mode === 'db') { clearTimeout(logTimer); logTimer = setTimeout(() => logDoc.set({ events: S.log }).catch(() => {}), 700); } else lsPut();
}
const items = type => [...S.items.values()].filter(o => o.type === type).sort((a, b) => (b.updated || 0) - (a.updated || 0));

/* ---------- starter board (marked as starters) ---------- */

/* ---------- helpers ---------- */
const icon = { proj: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h6"/></svg>', print: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v4H4zM12 8v5M9 13h6l-3 4zM3 21h18"/></svg>', idea: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>', car: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13l2-5a2 2 0 0 1 2-1.4h10A2 2 0 0 1 19 8l2 5v4H3z"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/></svg>' };
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? m + 'm ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'; };
const ex = o => o.starter ? '<span class="tag-ex">starter</span>' : '';
function greet() { const h = new Date().getHours(); return h < 5 ? 'Still up, Sir' : h < 12 ? 'Good morning, Sir' : h < 17 ? 'Good afternoon, Sir' : 'Good evening, Sir'; }
function countUp(root) {
  root.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count, suf = el.dataset.suf || '';
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = to + suf; return; }
    const t0 = performance.now(), d = 700;
    const step = t => { const k = Math.min(1, (t - t0) / d), v = Math.round(to * (1 - Math.pow(1 - k, 3))); el.textContent = v + suf; if (k < 1) requestAnimationFrame(step); };
    el.textContent = '0' + suf; requestAnimationFrame(step);
  });
}

/* ---------- views ---------- */
let view = (location.hash || '#overview').slice(1); if (!VIEWS.includes(view)) view = 'overview';
let feedTab = 'all', weekPick = null;
document.querySelectorAll('.rail button[data-view]').forEach(b => b.onclick = () => { location.hash = b.dataset.view; });
addEventListener('hashchange', () => { const v = location.hash.slice(1); view = VIEWS.includes(v) ? v : 'overview'; render(); scrollTo(0, 0); setTimeout(() => { if (typeof flyTo === 'function' && $('#jvpanel').hidden) flyTo(document.querySelector('.hero h1'), true); setTimeout(() => say(navLine(view)), 1200); }, 120); });

function overview(m) {

  const today = new Date(); const dow = (today.getDay() + 6) % 7; const mon = new Date(today); mon.setDate(today.getDate() - dow);

      <p class="sub muted" style="margin:0">${shift.on ? `On the clock since ${new Date(shift.since).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}. Pre-job checklist ${(shift.checks || []).length}/${SHOPCHECKS.length}. Side projects are parked until you clock out.` : empty ? 'The board is empty. Load the starter board or add your first project, and I\'ll keep score.' :
        `${active.length} project${active.length === 1 ? '' : 's'} moving, ${queued.length} print${queued.length === 1 ? '' : 's'} in the queue${printing ? ' (one on the bed now)' : ''}, ${goIdeas.length} idea${goIdeas.length === 1 ? '' : 's'} worth a proper look, and ${tasksLeft} thing${tasksLeft === 1 ? '' : 's'} on today's list.`}</p>
      <div class="quip">${shift.on ? esc(quip) : '"' + esc(quip) + '"'}</div>
      ${shift.on ? `<div class="readouts"><div><span>On the clock</span><b id="ro-clock">${fmtDur(Date.now() - shift.since)}</b></div><div><span>Pre-job checks</span><b>${(shift.checks || []).length}/${SHOPCHECKS.length}</b></div><div><span>Shop notes</span><b>${items('task').filter(t => t.area === 'work' && !t.done).length} open</b></div></div>` : ''}
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" type="button" id="herotalk">Talk to J.A.R.V.I.S.</button>
        ${empty ? '<button class="btn ghost" type="button" id="starter">Load starter board</button>' : '<button class="btn ghost" type="button" data-go="projects">New project</button>'}
      </div>
    </div>
    <div class="side">
      ${shift.on ? `<div class="holo-core" aria-hidden="true"><canvas id="jvc3" width="480" height="480"></canvas><span class="ro">J.A.R.V.I.S. · SHOP SYSTEMS ONLINE</span></div>` : ''}

        <svg viewBox="0 0 132 132"><circle class="spin" cx="66" cy="66" r="63"/><circle class="track" cx="66" cy="66" r="54"/><circle class="val" id="arcval" cx="66" cy="66" r="54" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
        <div class="mid"><b data-count="${overall}" data-suf="%">${overall}%</b><span>All projects</span></div>
      </div>

  </section>

  <section class="card shift ${shift.on ? 'onshift' : ''}">
    <div style="min-width:0"><div class="head" style="justify-content:flex-start;gap:10px"><h2>${shift.on ? 'On shift' : 'Off shift'}</h2><span class="pill">Technician B · CCE · D435</span></div>

/* ---------- "Hey Jarvis": hands-free listening ---------- */
const WAKE = /\b(?:hey|hi|okay|ok|yo|right)?\s*(?:jarvis|jarvas|jervis|jarvie|jarvis's)\b/;
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
J.hf = false; J.hfPaused = false; J.hfWake = 0; J.mode = null;
function startHF() {
  if (!J.dict) { toast('Hands-free needs Chrome or Edge, or the Claude desktop app.'); return; }
  if (J.tts) J.tts.stop().catch(() => {});
  J.hf = true; J.hfPaused = false; J.mode = 'hf'; updateHF();
  J.dict.start().catch(e => { J.mode = null; J.hf = false; updateHF(); if (e && e.code === 'not_granted') toast('Microphone is off for this page. Turn it on in the page permissions.'); else if (e && e.code !== 'stopped') toast('Couldn\'t start listening. Tap to try again.'); });
}
function stopHF() { J.hf = false; J.hfPaused = false; if (J.dict && J.mode === 'hf') J.dict.stop(); J.mode = null; updateHF(); setState('idle'); }
function updateHF() {
  const b = $('#hfbtn'), on = J.hf && J.mode === 'hf';
  if (b) { b.setAttribute('aria-pressed', String(on)); b.textContent = on ? 'Hands-free: on' : J.hfPaused ? 'Hands-free: tap to resume' : 'Hands-free “Hey Jarvis”'; }
  const tag = $('#hftag'); if (tag) { if (on || J.hfPaused) $('#jvhint').hidden = true; tag.hidden = !(on || J.hfPaused); tag.textContent = on ? 'Listening for “Hey Jarvis”' : 'Tap or press Space to keep listening'; }
  if (on && !J.busy && J.state !== 'listen') setState('idle', 'Waiting for "Hey Jarvis"');
}
function hearHF(text) {
  if (!text) return;
  const raw = text.trim(), n = norm(raw), m = WAKE.exec(n);
  // while he talks, the mic also hears him: only "Jarvis, stop" / "Hey Jarvis …" get through
  const talking = J.state === 'speak' || Date.now() < J.speakingUntil;
  if (talking) {
    if (!m) return;
    if (SYN) SYN.cancel(); if (J.tts) J.tts.stop().catch(() => {});
    J.speakingUntil = 0;
    if (/\b(stop|quiet|enough|shut up|cancel|that's all)\b/.test(n)) { setState('idle', 'Waiting for "Hey Jarvis"'); addMsg('act', '› Interrupted'); return; }
  }
  if (J.busy) return;
  if (m) {
    // the words after the wake phrase are the request
    const w = raw.toLowerCase().search(/jarv|jerv/);
    const cmd = (w >= 0 ? raw.slice(w).replace(/^\S+[\s,.!?:;-]*/, '') : '').trim();
    if (cmd.replace(/[^a-z0-9]/gi, '').length > 2) { J.hfWake = 0; hfCommand(cmd); }
    else { J.hfWake = Date.now(); setState('listen', 'Yes, Sir?'); if ($('#jvpanel').hidden) openPanel(true); addMsg('j', 'Yes, Sir?'); }
  } else if (J.hfWake && Date.now() - J.hfWake < 12000) { J.hfWake = 0; hfCommand(raw); }
  else if (J.state === 'listen') setState('idle', 'Waiting for "Hey Jarvis"');
}
function hfCommand(cmd) { if ($('#jvpanel').hidden) openPanel(true); ask(cmd); }
// before speaking, hand the microphone back so the voice can play
async function releaseMicForSpeech() {
  // only needed when the browser has no speech engine of its own
  if (!SYN && J.hf && J.mode === 'hf' && J.tts && $('#jvvoice').checked) { J.hfPaused = true; try { await J.dict.stop(); } catch (e) {} updateHF(); }
}
$('#hfbtn').onclick = () => { (J.hf && J.mode === 'hf') ? stopHF() : startHF(); };
document.addEventListener('keydown', e => {
  if (e.key !== ' ' || !J.hfPaused) return;
  const a = document.activeElement; if (a && a.matches('input, textarea, select, button')) return;
  e.preventDefault(); startHF();
});

/* ---------- boot ---------- */
(async () => {
  const cl = window.claude; if (!cl || !cl.use) return;
  cl.use('sample').then(s => { J.sample = s; }).catch(() => {});
  cl.use('tts').then(t => { if (!t) { if (!SYN) { $('#jvvoice').closest('label').hidden = true; $('#jvvoicepick').closest('label').hidden = true; } else { [...$('#jvvoicepick').options].forEach(o => { if (o.value !== 'british') o.remove(); }); $('#jvvoicepick').value = 'british'; } return; } J.tts = t; t.onState(({ state }) => { if (state === 'speaking') setState('speak'); else if (state === 'idle' && J.state === 'speak') setState('idle'); }); }).catch(() => {});
  cl.use('dictation').then(d => {
    if (!d) return; J.dict = d; $('#jvmic').hidden = false; $('#hfbtn').hidden = false;
    let heard = '';
    d.onPartial(({ text }) => {
      if (J.mode === 'hf') {
        if (!text || !WAKE.test(norm(text))) return;
        if (J.state === 'speak' || Date.now() < J.speakingUntil) { if (SYN) SYN.cancel(); J.speakingUntil = 0; }   // barge-in: stop talking when called
        if (!J.busy) setState('listen', 'Yes, Sir?');
        return;
      }
      if (text) $('#jvtext').value = (heard + ' ' + text).trim();
    });
    d.onFinal(({ text }) => {
      if (J.mode === 'hf') { hearHF(text); return; }
      heard = (heard + text).trim(); $('#jvtext').value = heard;
    });
    d.onState(({ state, reason }) => {
      const on = state !== 'idle';
      if (J.mode === 'hf') {
        if (on) { if (!J.busy) setState('idle', 'Waiting for "Hey Jarvis"'); }
        else { J.mode = null; if (reason !== 'stopped') { J.hf = false; J.hfPaused = true; toast(reason === 'time_limit' ? 'Hands-free ran for an hour. Tap J.A.R.V.I.S. to start again.' : 'Hands-free paused. Tap J.A.R.V.I.S. to resume.'); } }
        updateHF(); return;
      }
      $('#jvmic').setAttribute('aria-pressed', String(on));
      if (on) { heard = ''; setState('listen'); } else { setState('idle'); const v = $('#jvtext').value.trim(); if (v) { $('#jvtext').value = ''; ask(v); } }
    });
  }).catch(() => {});
})();
lsGet(); loaded = true; render();
(async () => {
  const cl = window.claude; if (!cl || !cl.use) return;
  try {
    const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
    const id = user ? await user.id() : null;
    if (!db || !id) return;
    const base = db.doc('data/users/' + id + '/hub');
    coll = base.collection('items'); logDoc = db.doc('data/users/' + id + '/hub/meta/log');
    mode = 'db';
    const local = [...S.items.values()], localLog = S.log.slice();
    let first = true;
    coll.onSnapshot(snap => {
      const seen = new Set();
      snap.docs.forEach(d => { seen.add(d.id); if (!writing[d.id]) S.items.set(d.id, { ...d.data(), id: d.id }); });
      if (first) { first = false; local.forEach(o => { if (!seen.has(o.id)) save(o); }); try { localStorage.removeItem('cc.items'); } catch (e) {} }
      [...S.items.keys()].forEach(k => { if (!seen.has(k) && !writing[k]) S.items.delete(k); });
      const a = document.activeElement; if (!(a && a.closest && a.closest('form'))) render();
    }, () => { mode = 'local'; render(); });
    logDoc.onSnapshot(d => { if (d.exists) { S.log = (d.data().events || []); } else if (localLog.length) { S.log = localLog; logDoc.set({ events: localLog }).catch(() => {}); } const a = document.activeElement; if (!(a && a.closest && a.closest('form'))) render(); }, () => {});
  } catch (e) {}
})();
})();
</script>
